<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Спрайты Вени</title>
<style>
  *{box-sizing:border-box}body{margin:0;background:#211619;color:#f4e8cd;font:16px system-ui}main{max-width:1280px;margin:auto;padding:16px}h1,h2{margin:20px 0 12px}#scene{width:100%;aspect-ratio:16/9}canvas{display:block;max-width:100%;height:auto!important}.controls{display:flex;flex-wrap:wrap;gap:20px;align-items:center;margin:12px 0}input{width:240px;accent-color:#edb44b}select{padding:8px;background:#f4e8cd;border-radius:6px}.heads{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;padding:12px;background:#493139}.head{margin:0;text-align:center;background:#302228;border-radius:10px;overflow:hidden}.head img{display:block;width:100%;height:212px;object-fit:contain}.head figcaption{padding:10px 2px;font-size:14px}.atlas,.parts{background:repeating-conic-gradient(#493139 0 25%,#302228 0 50%) 0/24px 24px;padding:12px}.atlas img{display:block;width:100%}.parts{display:grid;grid-template-columns:2fr 1fr 1fr;gap:20px}.parts figure{margin:0;text-align:center}.parts img{width:100%;height:330px;object-fit:contain}.info{color:#d0bda9}
</style>
<main>
<h1>Веня — финальный босс</h1>
<p class="info">Полный набор спрайтов в игровой сцене. Ползунок показывает все девять поз борьбы.</p>
<div class="controls"><label>Позиция <input id="position" type="range" min="-1" max="1" step="0.01" value="0"></label><label>Выражение <select id="expression"></select></label></div>
<div id="scene"></div>
<h2>Семь выражений морды</h2><section class="heads" id="heads"></section>
<h2>Девять поз борьбы</h2><section class="atlas" id="atlas"><img src="/art/opponents/venya/arms_motion.png" alt="Девять поз борьбы Вени"></section>
<h2>Торс, свободная рука и плечо</h2><section class="parts" id="parts"></section>
</main>
<script type="module">
import Phaser from 'phaser';
import { ArtStage } from '/src/game/artStage.ts';
import { queueArt, HEAD_KEYS, hasOppArt } from '/src/game/art.ts';
const query=new URLSearchParams(location.search);
const labels=['Спокойствие','Напряжение','Смена техники','Усталость','Поражение','Победа','Пресс'];
const position=document.querySelector('#position'),expression=document.querySelector('#expression');
position.value=query.get('p')||'0';
expression.innerHTML=HEAD_KEYS.map((key,i)=>`<option value="${key}">${labels[i]}</option>`).join('');
expression.value=HEAD_KEYS.includes(query.get('head'))?query.get('head'):'calm';
document.querySelector('#heads').innerHTML=HEAD_KEYS.map((key,i)=>`<figure class="head"><img src="/art/opponents/venya/head_${key}.png" alt="${labels[i]}"><figcaption>${labels[i]}</figcaption></figure>`).join('');
document.querySelector('#parts').innerHTML=['torso_motion','arm_free','cuff'].map((key,i)=>`<figure><img src="/art/opponents/venya/${key}.png" alt="${['Торс','Рука на рукояти','Накладка плеча'][i]}"><figcaption>${key}.png</figcaption></figure>`).join('');
class Preview extends Phaser.Scene {
 preload(){this.errors=[];this.load.on('loaderror',file=>this.errors.push(file.url));queueArt(this.load);}
 create(){
  if(this.errors.length||!hasOppArt(this,'venya')){document.title='ERROR: Venya '+this.errors.join(',');return;}
  this.art=new ArtStage(this,'venya');
  this.frame={dt:1/60,p:Number(position.value),ourTech:'hook',oppTech:'hook',fighting:true,head:expression.value,breathe:0,lower:0,ourEffort:0,shakeOur:{x:0,y:0},shakeOpp:{x:0,y:0}};
  for(let i=0;i<90;i++)this.art.update(this.frame);
  window.venyaPreview={scene:this,art:this.art,frame:this.frame};
  document.title='READY: Venya';
 }
 update(){if(this.art){this.frame.p=Number(position.value);this.frame.head=expression.value;this.frame.oppTech=expression.value==='press'?'press':'hook';this.art.update(this.frame);}}
}
new Phaser.Game({type:Phaser.CANVAS,parent:'scene',width:1280,height:720,banner:false,audio:{noAudio:true},scene:[Preview]});
</script>
</html>
