<!doctype html>
<html lang="ru"><meta charset="utf-8"><title>Спрайты Ермеса</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:24px;background:#241917;color:#f5e6c8;font:16px system-ui}h1{margin:0 0 12px}p{max-width:900px;color:#ddc4a4}figure{margin:0}figcaption{padding:10px;color:#f5e6c8}.faces{display:grid;grid-template-columns:repeat(7,minmax(100px,1fr));gap:12px;max-width:1400px}.tile{background:#513631;border:1px solid #845641;border-radius:12px;overflow:hidden}.faces img{width:100%;height:230px;object-fit:contain}.parts{display:flex;flex-wrap:wrap;gap:16px;margin-top:24px}.parts img{width:330px;height:280px;object-fit:contain}.sheet{max-width:100%;width:1200px;background:#513631;border-radius:12px;padding:12px;margin-top:24px}.sheet img{width:100%;display:block}a{color:#ffd986}.links{display:flex;gap:16px;margin:20px 0}
</style>
<h1>Ермес — полный набор спрайтов</h1>
<p>Утверждённый образ: короткая тёмная стрижка, короткая щетина, чёрная футболка, мощные предплечья.</p>
<div class="links"><a href="preview.html">Посмотреть в сцене боя</a><a href="../../../output/ermes-sprites.zip" download>Скачать ZIP</a></div>
<div class="faces" id="faces"></div><div class="parts" id="parts"></div>
<figure class="sheet"><img src="../../../public/art/opponents/ermes/arms_motion.png" alt="Девять поз борьбы"><figcaption>Девять поз борьбы — от левого пина через нейтраль к правому пину</figcaption></figure>
<figure class="sheet"><img src="../../../public/art/scene/bg.png" alt="Общий фон бара"><figcaption>Общий фон бара</figcaption></figure>
<script>
const base='../../../public/art/opponents/ermes/';
const faces=[['calm','Спокойствие'],['strain','Усилие'],['telegraph','Смена хвата'],['tired','Усталость'],['lose','Поражение'],['win','Победа'],['press','Пресс']];
document.querySelector('#faces').innerHTML=faces.map(([k,t])=>'<figure class="tile"><img src="'+base+'head_'+k+'.png" alt="'+t+'"><figcaption>'+t+'</figcaption></figure>').join('');
document.querySelector('#parts').innerHTML=[['torso_motion','Корпус'],['arm_free','Свободная рука'],['cuff','Стык рабочего рукава'],['concept','Утверждённый образ']].map(([k,t])=>'<figure class="tile"><img src="'+base+k+'.png" alt="'+t+'"><figcaption>'+t+'</figcaption></figure>').join('');
</script></html>
